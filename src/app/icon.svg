<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- One vertebra, side view: body on the left, spinous process sloping back and down. -->
    <g id="v">
      <rect x="-5" y="-3" width="10" height="6" rx="2"/>
      <rect x="2.5" y="-2.6" width="7.5" height="2.6" rx="1.3" transform="rotate(24 2.5 -1.3)"/>
    </g>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="#7747ff"/>
  <g fill="#fff">
    <use href="#v" transform="translate(14.8 8.6) rotate(7)"/>
    <use href="#v" transform="translate(13.6 16)"/>
    <use href="#v" transform="translate(14.8 23.4) rotate(-7)"/>
  </g>
</svg>
